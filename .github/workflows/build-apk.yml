name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | grep -o -E '[0-9]+' | head -n 1)
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Could not detect active Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java version verification passed: Java $JAVA_MAJOR (>= 17)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping generation."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            if [ ! -f "./debug.keystore" ]; then
              echo "::error::Failed to create debug.keystore."
              exit 1
            fi
            echo "Successfully generated ./debug.keystore."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at: $EXPECTED_APK"
            echo "Searching for APKs inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file exists but is empty: $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac

          echo "Verified APK exists and is valid: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Verified APK missing or empty at $EXPECTED_APK"
            exit 1
          fi

          TEMP_RELEASE_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")
          RAW_REPO_NAME="${{ github.repository }}"
          CLEAN_REPO_NAME=$(echo "$RAW_REPO_NAME" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9._-]/-/g')
          if [ -z "$CLEAN_REPO_NAME" ]; then
            CLEAN_REPO_NAME="app"
          fi

          ASSET_NAME="${CLEAN_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_RELEASE_DIR}/${ASSET_NAME}"

          cp "$EXPECTED_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version || { echo "::error::GitHub CLI (gh) is not available."; exit 1; }
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset does not exist or is empty at '$ASSET_PATH'."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "::error::Release asset is not an .apk file: '$ASSET_PATH'"; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          cat << 'EOF' > release_notes.md
          ### Automated Debug Build
          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run:** #${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** `${{ github.sha }}`
          - **Built With:** Gradle 9.3.1 & Java 17

          > **Notice:** This APK is intended for testing and verification. It is signed with a temporary debug keystore and is not a Google Play Store production release.
          EOF

          echo "Publishing release with tag '$RELEASE_TAG'..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="${{ steps.publish_release.outputs.release_tag }}"
          RELEASE_TITLE="${{ steps.publish_release.outputs.release_title }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=================================================="
            echo "GitHub Release published successfully!"
            echo "Tag: $RELEASE_TAG"
            echo "Title: $RELEASE_TITLE"
            echo "Asset: $ASSET_NAME"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            echo "Release URL: $RELEASE_URL"
            echo "=================================================="

            {
              echo "## 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "The debug APK was built and published successfully to GitHub Releases."
              echo ""
              echo "- **Release:** [$RELEASE_TITLE]($RELEASE_URL)"
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Download APK:** The APK (\`$ASSET_NAME\`) can be downloaded directly from the **Assets** section of the [Release Page]($RELEASE_URL)."
              echo "- **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also available below."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed or encountered an error."
            echo "APK build succeeded, and the Actions artifact remains available."

            {
              echo "## ⚠️ Debug APK Built - Release Notice"
              echo ""
              echo "The debug APK was built successfully, but automatic GitHub Release publishing did not complete."
              echo ""
              echo "- **Actions Artifact Available:** The verified debug APK is available as a workflow artifact named \`app-debug-apk\` at the bottom of this run."
              echo "- You can download \`app-debug-apk\` directly from this GitHub Actions run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
